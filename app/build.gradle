plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minimal.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.minimal.tvlauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideload use).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party libraries on purpose: tiny APK, no background network use.
dependencies {
}

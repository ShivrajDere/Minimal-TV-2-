<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send photos to TV</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:linear-gradient(160deg,#0b1020,#1b2a6b 60%,#6c3bd1);color:#fff;
       display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:440px;background:rgba(10,14,24,.72);border:1px solid rgba(255,255,255,.12);
        border-radius:22px;padding:26px;backdrop-filter:blur(10px)}
  h1{margin:0 0 4px;font-size:22px;font-weight:600}
  p{margin:0 0 18px;color:#b9c0d4;font-size:14px}
  label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9aa3bd;margin-bottom:6px}
  input[type=text]{width:100%;padding:14px;font-size:22px;letter-spacing:.4em;text-align:center;border-radius:12px;
       border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;margin-bottom:18px}
  .pick{display:block;text-align:center;padding:16px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.35);
        cursor:pointer;color:#dfe5ff}
  .pick input{display:none}
  button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:600;
         background:#6c8cff;color:#071030;cursor:pointer}
  button:disabled{opacity:.45}
  ul{list-style:none;margin:16px 0 0;padding:0}
  li{font-size:13px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px}
  li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok{color:#5be3a8}.err{color:#ff7b7b}
</style>
</head>
<body>
<div class="card">
  <h1>Send photos to your TV</h1>
  <p>Photos appear in the launcher's gallery and can be used as the wallpaper slideshow.</p>
  <label for="pin">PIN shown on TV</label>
  <input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
  <label class="pick"><span id="pickText">Choose photos</span>
    <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
  <button id="go" disabled>Upload</button>
  <ul id="log"></ul>
</div>
<script>
const files=document.getElementById('files'),go=document.getElementById('go'),
      pin=document.getElementById('pin'),log=document.getElementById('log'),pt=document.getElementById('pickText');
function refresh(){go.disabled=!(files.files.length&&pin.value.length===4);
  pt.textContent=files.files.length?files.files.length+' photo(s) selected':'Choose photos';}
files.onchange=refresh;pin.oninput=refresh;
go.onclick=async()=>{
  go.disabled=true;log.innerHTML='';
  for(const f of files.files){
    const li=document.createElement('li');
    li.innerHTML='<span></span><span>sending…</span>';li.firstChild.textContent=f.name;log.appendChild(li);
    try{
      const r=await fetch('/upload?name='+encodeURIComponent(f.name)+'&pin='+encodeURIComponent(pin.value),{method:'POST',body:f});
      const t=await r.text();
      li.lastChild.textContent=r.ok?'done':t;li.lastChild.className=r.ok?'ok':'err';
      if(r.status===403||r.status===429)break;
    }catch(e){li.lastChild.textContent='failed';li.lastChild.className='err';}
  }
  files.value='';refresh();
};
</script>
</body>
</html>
